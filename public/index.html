<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="NoChat is a social space for people, conversations and chronological sharing. Join 30+ members building a more thoughtful online community." />
  
  <!-- Open Graph / SEO -->
  <meta property="og:title" content="NoChat - Humans. Not Algorithms." />
  <meta property="og:description" content="NoChat is a social space for people, conversations and chronological sharing. Join 30+ members building a more thoughtful online community." />
  <meta property="og:image" content="/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://nochat.com" />
  
  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="NoChat - Humans. Not Algorithms." />
  <meta name="twitter:description" content="NoChat is an authentic place for real humans. No fake likes, no ads, no algorithm." />
  <meta name="twitter:image" content="/og-image.png" />

  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>NoChat — Humans. Not Algorithms.</title>

  <!-- Typography: Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/app-v4.css" />
</head>
<body>
  <div id="app"></div>

  <!-- Global Auth Modal -->
  <div id="auth-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-box" style="padding: 32px 28px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h2 id="auth-title" style="font-size: 20px; font-weight: 800;">Welcome to NoChat</h2>
        <button class="btn-icon" data-action="close-auth"><i data-lucide="x"></i></button>
      </div>

      <div style="display: flex; border-bottom: 1px solid var(--border); margin-bottom: 24px;">
        <button class="auth-tab-btn active" data-auth-tab="login" style="flex:1; padding-bottom:10px; font-weight:700; border-bottom:2px solid var(--text);">Sign In</button>
        <button class="auth-tab-btn" data-auth-tab="register" style="flex:1; padding-bottom:10px; font-weight:500; color:var(--muted);">Join NoChat</button>
      </div>

      <form id="auth-form" style="display: flex; flex-direction: column; gap: 16px;">
        <div class="form-field signup-only hidden">
          <label for="auth-display-name">Display Name</label>
          <input type="text" id="auth-display-name" name="displayName" placeholder="e.g. Alex Rivera" style="height:42px; padding:0 14px;" />
        </div>

        <div class="form-field">
          <label for="auth-identifier" id="auth-identifier-label">Username or Email</label>
          <input type="text" id="auth-identifier" name="identifier" autocomplete="username" placeholder="username or your email" required style="height:42px; padding:0 14px;" />
        </div>

        <div class="form-field signup-only hidden">
          <label for="auth-email">Email Address (Optional recovery)</label>
          <input type="email" id="auth-email" name="email" placeholder="you@domain.com" style="height:42px; padding:0 14px;" />
        </div>

        <div class="form-field">
          <label for="auth-password">Password</label>
          <input type="password" id="auth-password" name="password" autocomplete="current-password" placeholder="••••••••" required style="height:42px; padding:0 14px;" />
        </div>

        <p id="auth-error-msg" class="hidden" style="color:var(--like-red); font-size:13px;"></p>

        <button type="submit" class="btn btn-primary" id="auth-submit-btn" style="height:44px; font-size:15px; margin-top:8px;">
          Continue
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 12px; color: var(--muted);">
        Crafted with authentic care by <a href="https://denpher-portfolio-6xe8.vercel.app/" target="_blank" rel="noopener noreferrer" style="color:var(--accent-blue); font-weight:600;">Denpher</a>
      </div>
    </div>
  </div>

  <!-- Lucide Icons Script -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <!-- Socket.IO Client -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- Modular Application Entry -->
  <script type="module" src="/js/app-v4.js"></script>
</body>
</html>
